<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bokarkiv">
    <title>Bokarkiv</title>

    <link rel="icon" type="image/png" href="/.assets/images/icons/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="./assets/images/icons/favicon.svg">
    <link rel="shortcut icon" href="./assets/images/icons/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/images/icons/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/forms.css">

    <script src="./js/app.js" defer></script>
    <script src="./js/filter.js" defer></script>

</head>

<body>
    <header ader id="header" class="header">
        <div class="hero">
            <div class="logo"><img src="./assets/images/icons/book-open.svg" alt="åpen bok"></div>
            <div class="heading">
                <h1>Boklogg</h1>
                <p>Registrer bøkene du leser, filtrer, sorter og få enkel lesestatistikk</p>
            </div>
        </div>
    </header>
    <section class="cards container">
        <div class="card all-books">
            <div class="img"><img src="./assets/images/icons/chart-bar.svg"></div>
            <div class="info">
                <p class="count count-total">12</p>
                <p>Bøker i samlinger</p>
            </div>
        </div>
        <div class="card all-lest">
            <div class="img"><img src="./assets/images/icons/check-circle.svg"></div>
            <div class="info">
                <p class="count count-read">8</p>
                <p>Bøker lest</p>
            </div>
        </div>
        <div class="card all-reading">
            <div class="img"><img src="./assets/images/icons/book-open.svg"></div>
            <div class="info">
                <p class="count count-reading">12</p>
                <p>Bøker jeg leser nå</p>
            </div>
        </div>
        <div class="card stat">
            <div class="img"><img src="./assets/images/icons/tag.svg"></div>
            <div class="info">
                <p class="bold">Lesefremdrift</p>
                <p><span class="count-read">10</span> av <span class="count-total">10</span> bøker lest</p>
            </div>
        </div>
    </section>
    <!--FORM-->
    <main class="dashboard container">
        <aside class="add-book">
            <h2>Legg til bok</h2>
            <form class="book-form" id="bookForm">
                <div class="form-group">
                    <label for="title">Tittel:</label>
                    <input type="text" id="title" name="name" placeholder="Skriv boktittel" required>
                </div>
                <div class="form-group">
                    <label for="author">Forfatter:</label>
                    <input type="text" id="author" name="author" placeholder="Skriv forfatternavn" required>
                </div>
                <div class="form-group">
                    <label for="pages">Antall sider:</label>
                    <input type="text" id="pages" name="author" number placeholder="Antall sider" required>
                </div>
                <div class="form-group">
                    <label for="genre">Sjanger:</label>
                    <select id="genre">
                        <option value="all">Velg sjanger</option>
                        <option value="crime">Krim</option>
                        <option value="biografi">Biografi</option>
                        <option value="music">Musikk</option>
                        <option value="roman">Roman</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="status">Status:</label>
                    <select id="status">
                        <option value="all">Velg status</option>
                        <option value="read">Lest</option>
                        <option value="reading">Leser nå</option>
                        <option value="wait">Har ikke lest</option>
                    </select>
                </div>

                <div class="form-group">
                    <button id="btnSubmit" class="btn"> Legg til book</button>
                    <button id="btnCancel" class="btn btn-cancel">Avbryt</button>

                </div>
            </form>
        </aside>
        <!--Book table-->
        <section class="my-books">
            <div class="search">
                <div class="heading">
                    <h2>Mine bøker</h2>
                </div>
                <div class="search-box">
                    <span class="search-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <circle cx="11" cy="11" r="7"></circle>
                            <path d="m20 20-4-4"></path>
                        </svg>
                    </span>
                    <input type="search" id="searchInput" placeholder="Søk etter titler eller forfatter">
                </div>
                <a href="./index.html" class="reset">Nullstill filter x</a>
            </div>
            <div class="filter">
                <div class="form-group">
                    <label for="filterCat">Sjanger:</label>
                    <select id="filterCat">
                        <option value="all">Alle</option>
                        <option value="crime">Krim</option>
                        <option value="biografi">Biografi</option>
                        <option value="fag">Fag</option>
                        <option value="music">Musikk</option>
                        <option value="roman">Roman</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="filterStatus">Status:</label>
                    <select id="filterStatus">
                        <option value="all">Alle</option>
                        <option value="read">Lest</option>
                        <option value="wait">Skal lese</option>
                        <option value="reading">Påbegynt</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="status">Sorter etter:</label>
                    <select id="filterSort">
                        <option value="all">Sorter</option>
                        <option value="a-z">Tittel A-Z</option>
                        <option value="z-a">Tittel Z-A</option>
                        <option value="pages-asc">Sider Lavest</option>
                        <option value="pages-desc">Sider Høyest</option>

                    </select>
                </div>
            </div>
            <div id="bookListDiv">
                <table id="bookListTable">

                </table>
            </div>
        </section>
    </main>

    <footer id="footer">
        <div class="footer">
            <img src="./assets/images/icons/book-open.svg" alt="logo" width="120" height="40">
        </div>
    </footer>
</body>

</html>
